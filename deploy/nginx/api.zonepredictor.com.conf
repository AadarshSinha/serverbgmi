# Install as /etc/nginx/sites-available/api.zonepredictor.com, symlink it into
# sites-enabled, then run certbot — certbot rewrites this file in place to add
# the listen 443 block and the certificate paths.

server {
    listen 80;
    server_name api.zonepredictor.com;

    # Must stay LARGER than the app's MAX_UPLOAD_BYTES (10MB by default). If
    # nginx rejects the upload first it answers with an HTML error page, which
    # breaks the "every failure is JSON" contract the frontend relies on. Let
    # the request through and let Flask return {"code":"FILE_TOO_LARGE"}.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # /predict hashes the client IP for its request log. Without this
        # header every request looks like it came from 127.0.0.1, so the whole
        # column becomes one repeated hash.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A cold prediction measured ~27s. nginx's default read timeout is 60s,
        # which is uncomfortably close once the droplet is under load.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
